<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EURO 2028 – selejtező sorsoló</title><style>body{font-family:Arial,sans-serif;background:#eef2f7;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:#101827;color:#fff}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.group{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 7px #0001}button{border:0;border-radius:8px;padding:11px 16px;background:#1d4ed8;color:#fff;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}.notice{background:#fff8e6;border-left:4px solid #f59e0b;padding:10px;margin:12px 0}.hu{font-weight:800;text-decoration:underline}.host{font-weight:bold}@media(max-width:700px){.groups{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.groups{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>EURO 2028 selejtező – sorsoló</h1><div>Teljes mezőny szimulációja</div></div></header><main class="wrap"><button onclick="draw()">🎲 Új sorsolás</button><button onclick="copyResult()">📋 Eredmény másolása</button><div class="notice"><b>Megjegyzés:</b> a végleges UEFA-kalapok még nem ismertek; ez a jelenlegi szimulációs mezőny.</div><div id="result" class="groups"></div></main><script>const pots=[['Spain','France','England','Germany','Portugal','Netherlands','Belgium','Italy','Croatia','Denmark','Türkiye','Hungary'],['Switzerland','Austria','Serbia','Ukraine','Poland','Czechia','Greece','Romania','Norway','Sweden','Scotland','Wales'],['Slovakia','Slovenia','Republic of Ireland','Georgia','Finland','Iceland','Albania','Bosnia and Herzegovina','Montenegro','North Macedonia','Israel','Bulgaria'],['Kosovo','Armenia','Azerbaijan','Moldova','Estonia','Latvia','Lithuania','Cyprus','Malta','Luxembourg','Kazakhstan','Faroe Islands'],['Andorra','Liechtenstein','San Marino','Gibraltar','Belarus','Northern Ireland','TBC 1','TBC 2','TBC 3','TBC 4','TBC 5','TBC 6']];const hosts=['England','Republic of Ireland','Scotland','Wales','Northern Ireland'];const banned=[['Gibraltar','Spain'],['Kosovo','Bosnia and Herzegovina'],['Kosovo','Serbia'],['Ukraine','Belarus']];function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ok(g,t){if(hosts.includes(t)&&g.some(x=>hosts.includes(x)))return false;if(banned.some(([a,b])=>(a===t&&g.includes(b))||(b===t&&g.includes(a))))return false;return true}function make(){for(let z=0;z<10000;z++){let g=Array.from({length:12},()=>[]);let five=new Set(sh([...Array(12).keys()]).slice(0,7));for(let p=0;p<4;p++)sh(pots[p]).forEach((t,i)=>g[i].push(t));let p5=sh(pots[4]);let k=0;for(let i of five)g[i].push(p5[k++]);if(g.every((x,i)=>x.length===(i<5?4:5))&&g.every(x=>x.every((t)=>ok(x.filter(y=>y!==t),t))))return g}return null}function draw(){let g=make();if(!g)return;window.last=g;document.getElementById('result').innerHTML=g.map((x,i)=>`<section class="group"><h3>${String.fromCharCode(65+i)} csoport (${x.length})</h3><ol>${x.map(t=>`<li class="${t==='Hungary'?'hu':''} ${hosts.includes(t)?'host':''}">${t}</li>`).join('')}</ol></section>`).join('')}function copyResult(){if(!window.last)return; navigator.clipboard?.writeText(window.last.map((g,i)=>`${String.fromCharCode(65+i)} csoport: ${g.join(', ')}`).join('\n'));alert('Eredmény kimásolva.')}draw();</script></body></html>
